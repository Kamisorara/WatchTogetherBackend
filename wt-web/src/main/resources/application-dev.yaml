server:
  port: 8081

# 跨域配置
cors:
  allowedOrigins: "http://localhost:5000"

spring:
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/watch_together?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
    username: root
    password: Invincible
  data:
    # Redis配置
    redis:
      host: 192.168.11.130
      port: 6379
      password: Invincible
      database: 0
      connect-timeout: 60s
      lettuce:
        pool:
          max-active: 10
          max-idle: 8
          min-idle: 0
          max-wait: 5s
# Mybatis-plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml
#  global-config:
#    db-config:
#      # ID??
#      id-type: auto

# fastdfs配置
fdfs:
  open: true
  so-timeout: 1501
  connect-timeout: 601
  thumb-image: #缩略图生成参数
    width: 150
    height: 150
  tracker-list: #TrackerList参数,支持多个
    - localhost:22122

# Swagger 配置
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.wt.web.controller
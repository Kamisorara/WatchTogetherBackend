server:
  port: 8081

cors:
  allowedOrigins: "http://localhost:5000"

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://8.8.8.8:3306/watch_together?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8
    username: root
    password:
  data:
    redis:
      host: 8.8.8.8
      port: 8379
      password:
      database: 0
      connect-timeout: 60s
      lettuce:
        pool:
          max-active: 10
          max-idle: 8
          min-idle: 0
          max-wait: 5s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml
#  global-config:
#    db-config:
#      # ID??
#      id-type: auto

fdfs:
  open: true
  so-timeout: 20000 # 增加超时时间
  connect-timeout: 20000  # 增加连接超时时间
  pool: # 添加池配置
    max-total: 200        # 最大连接数
    max-wait-millis: 5000 # 等待连接的最大时间
    max-total-per-key: 50
  thumb-image: #缩略图生成参数
    width: 150
    height: 150
  tracker-list: #TrackerList参数,支持多个
    - 8.8.8.8:62122
  web-server-url:

# MinIO配置
minio:
  endpoint:       # 写你的实际 MinIO 域名或反代地址
  access-key:
  secret-key:
  bucket:

# Swagger 配置
springdoc:
  api-docs:
    enabled: false
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.wt.web.controller